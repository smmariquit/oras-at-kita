<style>
/* One phone column. Solid task tiles carry the only strong color, and color means one thing each, warm for unpaid care, green for paid work, blue for samahan, grey for rest. */
@font-face { font-family: "Figtree"; src: url("fonts/Figtree.woff2") format("woff2"); font-weight: 300 900; font-display: swap; }
:root {
  --paper: oklch(98.4% 0.006 80);
  --surface: #fff;
  --pale: oklch(95.5% 0.008 75);
  --rule: oklch(90% 0.01 75);
  --muted: oklch(46% 0.02 60);
  --ink: oklch(24% 0.02 60);
  --on-ink: #fff;
  --bahay: oklch(47% 0.16 30);
  --alaga: oklch(55% 0.16 45);
  --babuyan: oklch(43% 0.1 152);
  --kapehan: oklch(52% 0.12 150);
  --samahan: oklch(48% 0.16 262);
  --pahinga: oklch(50% 0.012 70);
  --iba: oklch(47% 0.1 118);
  --care: var(--bahay);
  --kita: var(--babuyan);
  --danger: oklch(50% 0.19 25);
  --font: "Figtree", system-ui, sans-serif;
  --radius: 16px;
  --ease-out: cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: oklch(19% 0.01 60); --surface: oklch(23% 0.012 60); --pale: oklch(26% 0.012 60); --rule: oklch(34% 0.012 60);
    --muted: oklch(76% 0.015 70); --ink: oklch(96% 0.006 80); --on-ink: oklch(19% 0.01 60);
    --danger: oklch(72% 0.16 25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: oklch(19% 0.01 60); --surface: oklch(23% 0.012 60); --pale: oklch(26% 0.012 60); --rule: oklch(34% 0.012 60);
  --muted: oklch(76% 0.015 70); --ink: oklch(96% 0.006 80); --on-ink: oklch(19% 0.01 60);
  --danger: oklch(72% 0.16 25);
  color-scheme: dark;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 18px/1.5 var(--font); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 480px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
h1, h2 { font-weight: 800; line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-size: 1.35rem; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, select:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.num { font-variant-numeric: tabular-nums; }
p { margin: 0; }

/* header */
.top { background: var(--paper); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.top .wrap { padding-block: 12px; display: grid; gap: 12px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.brand h1 { font-size: 1.25rem; }
.brand span { font-size: .95rem; color: var(--muted); }

/* running timer, filled with the activity's own color */
.timer { --c: var(--pahinga); display: flex; flex-wrap: wrap; align-items: center; gap: 14px; background: var(--c); color: #fff; border-radius: var(--radius); padding: 14px 14px 14px 18px; }
.timer .ic { width: 36px; height: 36px; flex: none; }
.timer .what { flex: 1; min-width: 0; display: grid; }
.timer .what b { font-size: 1rem; font-weight: 700; }
.timer .clock { font-size: 2rem; font-weight: 800; line-height: 1.1; white-space: nowrap; }
.timer .since { font-size: 1rem; opacity: .9; }
.timer.slim { padding: 8px 8px 8px 14px; }
.timer.slim .ic { width: 26px; height: 26px; }
.timer.slim .clock { font-size: 1.15rem; }
.timer.slim .since { display: none; }
.stopbtn { flex: 1 0 100%; background: #fff; color: oklch(24% 0.02 60); font-weight: 800; font-size: 1.05rem; border-radius: 999px; padding: 0 22px; min-height: 60px; white-space: nowrap; transition: transform 90ms var(--ease-out); }
.timer.slim { flex-wrap: nowrap; }
.timer.slim .stopbtn { flex: none; min-height: 48px; padding: 0 18px; font-size: 1rem; }
.stopbtn:active { transform: scale(.96); }

main { padding-block: 16px 120px; }
.view { display: grid; gap: 28px; }
.lead { color: var(--muted); }


/* task tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { --c: var(--pahinga); position: relative; display: grid; align-content: space-between; justify-items: start; gap: 18px; text-align: left; background: var(--c); color: #fff; border-radius: 20px; padding: 16px 16px 18px; min-height: 136px; transition: transform 90ms var(--ease-out); }
.tile:active { transform: scale(.96); }
.tile .ic { width: 40px; height: 40px; }
.tile b { display: block; font-size: 1.3rem; line-height: 1.1; font-weight: 800; }
.tile small { display: block; margin-top: 4px; font-size: 1rem; line-height: 1.3; opacity: .88; }
.tile.on { outline: 4px solid var(--ink); outline-offset: 3px; }
.tile.on::after { content: ""; position: absolute; top: 18px; right: 18px; width: 14px; height: 14px; border-radius: 50%; background: #fff; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }
.k-bahay { --c: var(--bahay); } .k-alaga { --c: var(--alaga); } .k-babuyan { --c: var(--babuyan); }
.k-kapehan { --c: var(--kapehan); } .k-samahan { --c: var(--samahan); } .k-pahinga { --c: var(--pahinga); } .k-iba { --c: var(--iba); }
.tile.k-pahinga { grid-column: 1 / -1; min-height: 0; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 14px; padding: 14px 16px; }
.tile.k-pahinga .ic { width: 32px; height: 32px; }
.tile.k-pahinga.on::after { top: 50%; margin-top: -7px; }

/* buttons: one filled, the rest outlined */
.primary { width: 100%; background: var(--ink); color: var(--on-ink); border-radius: 14px; padding: 16px; min-height: 58px; font-weight: 700; font-size: 1.05rem; transition: transform 90ms var(--ease-out); }
.primary:active, .wide:active { transform: scale(.98); }
.wide { width: 100%; background: var(--surface); border: 1.5px solid var(--rule); border-radius: 14px; padding: 16px; min-height: 58px; font-weight: 700; }
.danger { color: var(--danger); }
a.primary, a.wide { display: grid; place-items: center; text-align: center; text-decoration: none; }
a.wide { color: inherit; }

/* entry list */
.list { display: grid; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; align-items: center; gap: 14px; padding-block: 12px; border-bottom: 1px solid var(--rule); }
.list .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c); flex: none; }
.list .t { flex: 1; min-width: 0; font-weight: 600; }
.list .t small { display: block; color: var(--muted); font-size: 1rem; font-weight: 400; }
.list .m { font-weight: 700; }
.del { width: 48px; height: 48px; border-radius: 50%; color: var(--muted); font-size: 1.5rem; line-height: 1; }
.del:hover { background: var(--pale); color: var(--danger); }
.empty { color: var(--muted); padding-block: 4px; }
.sec { display: grid; gap: 12px; }

/* week */
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.big { --c: var(--pahinga); background: var(--c); color: #fff; border-radius: 20px; padding: 16px 16px 18px; display: grid; gap: 6px; }
.big .n { font-size: 3rem; font-weight: 800; line-height: 1; }
.big .n small { font-size: 1.05rem; font-weight: 600; }
.big span:last-child { font-size: 1rem; line-height: 1.3; opacity: .9; }
.big.care { --c: var(--care); } .big.kita { --c: var(--kita); }
.bars { display: grid; gap: 16px; }
.bar { display: grid; gap: 6px; }
.bar .lbl { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
.bar .lbl .v { font-weight: 700; }
.bar .track { height: 14px; border-radius: 7px; background: var(--pale); overflow: hidden; }
.bar .track div { height: 100%; border-radius: 7px; background: var(--c); min-width: 3px; }
.days { display: grid; gap: 10px; }
.day { display: grid; grid-template-columns: 64px minmax(0, 1fr) 44px; align-items: center; gap: 12px; }
.day .stack { display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: var(--pale); }
.day .stack i { display: block; height: 100%; background: var(--c); }
.day .v { text-align: right; font-weight: 700; }
.day b { display: block; font-weight: 700; line-height: 1.2; }
.day small { display: block; color: var(--muted); font-size: .85rem; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .9rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 4px; background: var(--c); margin-right: 6px; vertical-align: -1px; }
.g-care { --c: var(--care); } .g-kita { --c: var(--kita); } .g-samahan { --c: var(--samahan); } .g-rest { --c: var(--pahinga); }

/* report */
.code { display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1.5px solid var(--rule); border-radius: var(--radius); padding: 14px 16px; }
.code .lbl { flex: 1; }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 52px; height: 52px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--rule); font-size: 1.5rem; font-weight: 700; }
.step output { min-width: 3ch; text-align: center; font-size: 1.5rem; font-weight: 800; }
pre { white-space: pre-wrap; background: var(--pale); border-radius: var(--radius); padding: 16px; margin: 0; font: 400 1rem/1.55 var(--font); user-select: all; }
.note { font-size: 1rem; color: var(--muted); }
.span { display: grid; grid-template-columns: 1fr 1fr; background: var(--pale); border-radius: 14px; padding: 4px; }
.span button { min-height: 48px; border-radius: 11px; font-weight: 700; color: var(--muted); }
.span button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px oklch(0% 0 0 / .12); }
.times { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.facts { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }

/* sheet (add forgotten time) */
.sheet { position: fixed; inset: auto 0 0 0; z-index: 20; background: var(--paper); border-radius: 24px 24px 0 0; box-shadow: 0 -8px 40px oklch(0% 0 0 / .25); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); max-height: 92vh; overflow-y: auto; }
.sheet .wrap { padding-block: 24px 0; display: grid; gap: 16px; }
.scrim { position: fixed; inset: 0; z-index: 19; background: oklch(0% 0 0 / .4); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--rule); border-radius: 999px; padding: 10px 16px; min-height: 50px; font-weight: 600; }
.chip .ic { width: 22px; height: 22px; color: var(--c, var(--ink)); }
.chip[aria-pressed="true"] { background: var(--c, var(--ink)); border-color: var(--c, var(--ink)); color: #fff; }
.chip[aria-pressed="true"] .ic { color: #fff; }
.chip.plain[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.dur { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--pale); border-radius: var(--radius); padding: 12px; }
.dur output { font-size: 1.6rem; font-weight: 800; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

/* sample mode: a band above the tabs, on every screen, until she starts her own */
.demo { background: var(--ink); color: var(--on-ink); }
.demo .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.demo span { font-weight: 600; line-height: 1.3; }
nav.tabs .demo button { display: flex; align-items: center; flex: none; background: var(--paper); color: var(--ink); font-weight: 800; border-radius: 999px; padding: 0 18px; min-height: 48px; white-space: nowrap; transition: transform 90ms var(--ease-out); }
nav.tabs .demo button:active { transform: scale(.96); }
body.sampling main { padding-bottom: 190px; }
body.sampling .toast { bottom: calc(158px + env(safe-area-inset-bottom, 0px)); }

/* get the app: Messenger's built-in browser can lose her hours */
.getapp { display: grid; gap: 10px; margin-block: 8px 20px; padding: 16px; border-radius: 20px; background: var(--pale); }
.getapp b { font-size: 1.1rem; }
.getapp.warn { background: var(--ink); color: var(--on-ink); }
.getapp a { display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 999px; font-weight: 800; text-decoration: none; }
.getapp.warn a.primary { background: var(--paper); color: var(--ink); }

/* tabs */
nav.tabs { position: fixed; inset: auto 0 0 0; z-index: 6; background: var(--paper); border-top: 1px solid var(--rule); overflow: hidden; padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs > .wrap { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-inline: 8px; }
nav.tabs > .wrap button { display: grid; justify-items: center; gap: 4px; padding: 8px 2px 10px; min-height: 68px; font-size: .9rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
nav.tabs button .pill { display: grid; place-items: center; width: 60px; height: 32px; border-radius: 16px; }
nav.tabs button .ic { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--ink); font-weight: 800; }
nav.tabs button[aria-current="page"] .pill { background: var(--ink); color: var(--on-ink); }

/* onboarding */
.intro { display: grid; gap: 24px; padding-block: 24px; }
.intro h2 { font-size: 2.2rem; line-height: 1.05; }
.intro ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 18px; }
.intro li { display: flex; gap: 14px; align-items: flex-start; }
.intro li .ic { width: 30px; height: 30px; flex: none; color: var(--kita); }

.field { display: grid; gap: 6px; }
.field label { font-weight: 700; }
.field input { width: 100%; min-width: 0; font: inherit; font-size: 1.2rem; color: var(--ink); background: var(--surface); border: 1.5px solid var(--rule); border-radius: 14px; padding: 14px 16px; min-height: 58px; }
#gcode { text-transform: lowercase; }
.field input[type="time"] { text-transform: none; }
.field .err { color: var(--danger); font-size: .95rem; }
.gstats { display: grid; gap: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--on-ink); border-radius: 14px; padding: 12px 16px; display: flex; gap: 16px; align-items: center; width: min(440px, calc(100% - 40px)); box-shadow: 0 6px 24px oklch(0% 0 0 / .25); }
.toast span { flex: 1; }
.toast button { font-weight: 800; text-decoration: underline; padding: 8px; }

.nudge { display: flex; gap: 16px; align-items: center; justify-content: space-between; background: var(--surface); border: 2px solid var(--ink); border-radius: var(--radius); padding: 10px 10px 10px 16px; }
.nudge button { font-weight: 800; text-decoration: underline; padding: 12px 6px; white-space: nowrap; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 16px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.steps li::before { content: counter(s); font-size: 1.6rem; font-weight: 800; line-height: 1; color: var(--kita); }
.qr { width: min(240px, 100%); height: auto; justify-self: center; background: #fff; border: 1.5px solid var(--rule); border-radius: var(--radius); padding: 12px; }
details.more { border-top: 1px solid var(--rule); padding-top: 4px; }
details.more summary { cursor: pointer; font-weight: 800; font-size: 1.15rem; padding: 14px 0; list-style: none; display: flex; justify-content: space-between; }
details.more summary::after { content: "+"; font-size: 1.5rem; line-height: 1; }
details.more[open] summary::after { content: "−"; }
details.more > div { display: grid; gap: 28px; padding-bottom: 8px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<!-- Add the supabase-js script back here once anonymous sign-in is on. Without it the app stays on the phone. -->
<script>
const CATS = [
  { id: 'bahay',   name: 'Gawaing bahay',   sub: 'luto, laba, linis', group: 'care' },
  { id: 'alaga',   name: 'Anak at matanda', sub: 'paligo, hatid, bantay, gamot', group: 'care' },
  { id: 'babuyan', name: 'Babuyan',      sub: 'pakain, linis, inahin, biik', group: 'kita' },
  { id: 'kapehan', name: 'Kape',            sub: 'pitas, sorting, packing, benta', group: 'kita' },
  { id: 'iba',     name: 'Bukid at benta',  sub: 'halamanan, prutas, biyahe, tindahan', group: 'kita' },
  { id: 'samahan', name: 'Samahan',         sub: 'meeting, training, gawain ng PFAI', group: 'samahan' },
  { id: 'pahinga', name: 'Pahinga',         sub: 'upo, kain, kwentuhan, FB', group: 'rest' },
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const GROUPCLASS = { care: 'g-care', kita: 'g-kita', samahan: 'g-samahan', rest: 'g-rest' };
const DAYS = ['Linggo', 'Lunes', 'Martes', 'Miyerkules', 'Huwebes', 'Biyernes', 'Sabado'];
const MONTHS = ['Ene', 'Peb', 'Mar', 'Abr', 'Mayo', 'Hun', 'Hul', 'Ago', 'Set', 'Okt', 'Nob', 'Dis'];
const KEY = 'oras-at-kita-v1';
const SUPABASE_URL = 'https://xdwfjttjkwesahxrlwdz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_picuHDp0x6XAy-E3AVZdHg_8BkdkceD';
const db = window.supabase && !SUPABASE_URL.startsWith('__')
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, storageKey: 'oras-at-kita-auth' } })
  : null;

const SITE = 'https://oras-at-kita.stimmie.dev/';
const NATIVE = window.OrasNative || null; // Only there inside the Android app.

let S = load();
let tab = 'ngayon';
let tick = null;

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.entries)) return s; } catch (e) {}
  return { consent: false, member: 1, entries: [], running: null, sample: false, dels: [], group: null, wipe: false, lastSync: 0 };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (NATIVE) NATIVE.setState(S.consent, S.running ? S.running.cat : '', S.running ? String(S.running.start) : '0');
}
S.dels = S.dels || []; S.group = S.group || null; S.remind = S.remind || { on: false, time: '19:00' };

/* The widget and the notification can start and stop the timer while this page is closed. */
function pullNative() {
  if (!NATIVE) return;
  const n = JSON.parse(NATIVE.pull());
  let long = null;
  n.done.forEach(d => {
    if (S.entries.some(e => e.id === d.id)) return;
    const e = { id: d.id, cat: d.cat, day: dayKey(d.start), mins: d.mins, start: d.start };
    S.entries.push(e);
    if (isLong(e.cat, e.mins)) long = e;
  });
  S.running = n.cat ? { cat: n.cat, start: n.start } : null;
  save();
  NATIVE.ack(n.done.length);
  if (long) openSheet({ edit: long });
}
function nativeResume() { pullNative(); render(); }
function nativeBack() {
  const s = document.querySelector('.scrim');
  if (s) { s.click(); return true; }
  if (S.consent && tab !== 'ngayon') { tab = 'ngayon'; render(); return true; }
  return false;
}

/* sync with the backend. The phone keeps working offline and catches up later. */
let syncing = false;
async function signIn() {
  const { data } = await db.auth.getSession();
  if (data.session) return data.session.user;
  const r = await db.auth.signInAnonymously();
  if (r.error) throw r.error;
  return r.data.user;
}
async function sync() {
  if (!db || syncing || !navigator.onLine) return;
  syncing = true;
  try {
    await signIn();
    if (S.wipe) {
      const { error } = await db.from('entries').delete().not('id', 'is', null);
      if (error) throw error;
      S.wipe = false;
    }
    const up = S.entries.filter(e => !e.sample && !e.synced);
    if (up.length) {
      const { error } = await db.from('entries').upsert(up.map(e => ({
        id: e.id, cat: e.cat, day: e.day, mins: e.mins, started_at: e.start ? new Date(e.start).toISOString() : null })));
      if (error) throw error;
      up.forEach(e => { e.synced = true; });
    }
    if (S.dels.length) {
      const ids = S.dels.slice();
      const { error } = await db.from('entries').delete().in('id', ids);
      if (error) throw error;
      S.dels = S.dels.filter(i => !ids.includes(i));
    }
    S.lastSync = Date.now(); S.syncError = '';
  } catch (e) {
    S.syncError = String(e.message || e);
  } finally {
    syncing = false; save(); drawSyncLine();
  }
}
async function pullIfEmpty() {
  if (!db || !navigator.onLine || S.entries.some(e => !e.sample)) return;
  try {
    const { data: s } = await db.auth.getSession();
    if (!s.session) return;
    const since = dayKey(Date.now() - 60 * 864e5);
    const { data, error } = await db.from('entries').select('id, cat, day, mins, started_at').gte('day', since);
    if (error || !data.length) return;
    data.forEach(r => S.entries.push({ id: r.id, cat: r.cat, day: r.day, mins: r.mins, start: r.started_at ? Date.parse(r.started_at) : null, synced: true }));
    save(); render();
  } catch (e) {}
}
function syncText() {
  if (!db) return 'Sa phone mo lang ito naka-save. Hindi kailangan ng load. Kapag nawala ang phone, mawawala rin ito.';
  const pending = S.entries.filter(e => !e.sample && !e.synced).length + S.dels.length;
  if (!navigator.onLine) return pending ? pending + ' log ang naghihintay. Mag-sync pag may internet na.' : 'Offline ka ngayon. Tuloy lang ang pag-log.';
  if (S.syncError) return 'Hindi pa naka-sync. Try ulit mamaya.';
  if (pending) return 'Syncing...';
  return S.lastSync ? 'Synced. Last sync ' + new Date(S.lastSync).toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit' }) + '.' : 'Synced.';
}
function drawSyncLine() { const el = document.getElementById('syncline'); if (el) el.textContent = syncText(); }

const dayKey = d => { d = new Date(d); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const keyDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const shortDate = k => { const d = keyDate(k); return MONTHS[d.getMonth()] + ' ' + d.getDate(); };
function hrs(mins) {
  const h = Math.floor(mins / 60), m = Math.round(mins % 60);
  if (!h) return m + ' min';
  return m ? `${h} oras ${m} min` : `${h} oras`;
}
const hrsShort = mins => (Math.round(mins / 6) / 10).toLocaleString('en-PH');
const bigHrs = mins => `${Math.round(mins / 60)}<small> oras</small>`;
const care = b => b.bahay + b.alaga, kita = b => b.babuyan + b.kapehan + (b.iba || 0);
const icon = (id, cls = 'ic') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let span = 7;
function last7(n = 7) {
  const out = [], t = new Date();
  for (let i = n - 1; i >= 0; i--) out.push(dayKey(new Date(t.getFullYear(), t.getMonth(), t.getDate() - i)));
  return out;
}

/* timer */
const isLong = (cat, mins) => mins > (cat === 'pahinga' ? 600 : 240);
function dropSample() {
  if (!S.sample) return;
  S.entries = S.entries.filter(e => !e.sample); S.sample = false;
  toast('Tinanggal na ang sample. Sa iyo na ang mga oras dito.');
}
function start(cat) {
  if (S.running && S.running.cat === cat) return stop();
  dropSample();
  if (S.running) stop(true);
  S.running = { cat, start: Date.now() };
  save(); render();
}
function stop(quiet) {
  const r = S.running; if (!r) return;
  S.running = null;
  let mins = Math.round((Date.now() - r.start) / 60000);
  if (mins < 1) { save(); render(); if (!quiet) toast('Wala pang 1 minuto, hindi ko muna na-save.'); return; }
  mins = Math.min(mins, 720);
  const e = { id: uid(), cat: r.cat, day: dayKey(r.start), mins, start: r.start };
  S.entries.push(e);
  save(); render(); sync();
  if (isLong(r.cat, mins)) openSheet({ edit: e });
  else if (!quiet) toast('Na-save ang ' + CAT[r.cat].name + ' (' + hrs(mins) + ')');
}

function renderTimer() {
  const el = document.getElementById('timer');
  el.hidden = !S.running;
  if (!S.running) return;
  const c = CAT[S.running.cat];
  const mins = Math.max(0, Math.floor((Date.now() - S.running.start) / 60000));
  const since = new Date(S.running.start).toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit' });
  el.className = 'timer k-' + c.id + (tab === 'ngayon' ? '' : ' slim');
  el.innerHTML = `${icon(c.id)}<div class="what"><b>${c.name}</b><span class="clock num">${hrs(mins)}</span><span class="since num">Nagsimula ${since}</span></div>
    <button type="button" class="stopbtn" id="stopbtn">Tapos na</button>`;
  document.getElementById('stopbtn').onclick = () => stop();
}

/* views */
// Messenger and Facebook open links in their own browser, which can clear what she saved.
const IN_APP = !NATIVE && /FBAN|FBAV|FB_IAB|Messenger|Instagram/i.test(navigator.userAgent);
const ANDROID = /Android/i.test(navigator.userAgent);
function getApp() {
  if (NATIVE) return '';
  if (IN_APP) return `<div class="getapp warn"><b>Naka-open ka sa loob ng Messenger.</b><span>Dito, puwedeng mawala ang mga oras mo. ${ANDROID ? 'I-download ang app para may sariling icon sa phone mo.' : 'Pindutin ang ⋯ sa taas, tapos "Open in browser".'}</span>${ANDROID ? '<a class="primary" href="oras-at-kita.apk" download>I-download ang app</a>' : ''}</div>`;
  if (ANDROID) return `<div class="getapp"><span>Mas madali kung naka-install. May sariling icon sa phone mo, parang Messenger.</span><a class="wide" href="oras-at-kita.apk" download>I-download ang app</a></div>`;
  return '';
}
function viewIntro() {
  return `${getApp()}<section class="intro">
    <h2>Tingnan kung saan napupunta ang oras mo.</h2>
    <p class="lead">Pindutin ang ginagawa mo. Titigil ang bilang pag pinindot mo ang Tapos na. Gumagana kahit walang load o signal.</p>
    <ul>
      <li>${icon('hand')}<div>Hindi ito required. Ikaw ang bahala kung gagamitin mo at kailan ka titigil.</div></li>
      <li>${icon('lock')}<div>Ikaw ang pipili kung kanino ise-send ang report, at kung ilalagay ang pangalan mo.</div></li>
      <li>${icon('samahan')}<div>Sa phone mo lang ito naka-save. Walang makakakita hangga't hindi mo sine-send ang report.</div></li>
      <li>${icon('lock')}<div>Walang account, password o sign up.</div></li>
    </ul>
    <button type="button" class="primary" id="go">Simulan</button>
    <button type="button" class="wide" id="try">I-try muna ang sample</button>
    <p class="note">Kailangan ng data sa unang buksan lang. Pagkatapos, gumagana na kahit walang load.</p>
  </section>`;
}

function sampleBanner() { return ''; }

function nudge() {
  const r = S.running;
  if (r && isLong(r.cat, (Date.now() - r.start) / 60000)) return `<div class="nudge"><span>${CAT[r.cat].name} pa rin ba? Pindutin ang Tapos na kung tapos ka na.</span></div>`;
  if (r) return '<p class="note">Pwede mong isara ang app o i-lock ang phone. Tuloy pa rin ang bilang.</p>';
  const t = new Date(), today = dayKey(t), yest = dayKey(new Date(t.getFullYear(), t.getMonth(), t.getDate() - 1));
  const mine = S.entries.filter(e => !e.sample);
  if (mine.some(e => e.day === today)) return '';
  if (mine.some(e => e.day === yest)) return `<div class="nudge"><span>Parehas ba kahapon ang araw mo?</span><button type="button" id="sameyest">Oo, ilagay ulit</button></div>`;
  if (mine.some(e => e.day < yest)) return `<div class="nudge"><span>Wala kang na-save kahapon.</span><button type="button" id="addyest">Ilagay</button></div>`;
  return '<p class="note">Pindutin ang ginagawa mo ngayon.</p>';
}

function copyYesterday() {
  const t = new Date(), today = dayKey(t), yest = dayKey(new Date(t.getFullYear(), t.getMonth(), t.getDate() - 1));
  const src = S.entries.filter(e => !e.sample && e.day === yest);
  src.forEach(e => S.entries.push({ id: uid(), cat: e.cat, day: today, mins: e.mins, start: null }));
  save(); render(); sync();
  toast('Nailagay ang ' + src.length + ' gawain mula kahapon.');
}

function viewNgayon() {
  const today = dayKey(Date.now());
  const items = S.entries.filter(e => e.day === today && CAT[e.cat]).sort((a, b) => (b.start || 0) - (a.start || 0));
  const tiles = CATS.map(c => `<button type="button" class="tile k-${c.id} ${S.running && S.running.cat === c.id ? 'on' : ''}" data-cat="${c.id}" id="tile-${c.id}">
      ${icon(c.id)}<span><b>${c.name}</b><small>${c.sub}</small></span></button>`).join('');
  return `${sampleBanner()}${nudge()}
    <div class="tiles">${tiles}</div>
    <button type="button" class="wide" id="addbtn">Nakalimutan? Ilagay ang oras</button>
    <section class="sec"><h2>Nagawa ngayon</h2>${listHTML(items)}</section>`;
}

function listHTML(items) {
  if (!items.length) return `<p class="empty">Wala ka pang na-save ngayon.</p>`;
  return `<ul class="list">${items.map(e => {
    const c = CAT[e.cat];
    const when = e.start ? new Date(e.start).toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit' }) : 'inilagay mo';
    return `<li class="k-${c.id}"><span class="dot"></span><div class="t">${c.name}<small>${when}</small></div><span class="m num">${hrs(e.mins)}</span>
      <button type="button" class="del" data-del="${e.id}" aria-label="I-delete ang ${c.name}, ${hrs(e.mins)}">×</button></li>`;
  }).join('')}</ul>`;
}

function weekTotals() {
  const days = last7(span), set = new Set(days);
  const byCat = Object.fromEntries(CATS.map(c => [c.id, 0]));
  const byDay = Object.fromEntries(days.map(d => [d, Object.fromEntries(CATS.map(c => [c.id, 0]))]));
  for (const e of S.entries) if (set.has(e.day) && CAT[e.cat]) { byCat[e.cat] += e.mins; byDay[e.day][e.cat] += e.mins; }
  return { days, byCat, byDay };
}

const spanSwitch = () => `<div class="span" role="group" aria-label="Haba ng panahon">
    <button type="button" data-span="7" aria-pressed="${span === 7}">7 araw</button>
    <button type="button" data-span="30" aria-pressed="${span === 30}">30 araw</button></div>`;

function viewLinggo() {
  const { days, byCat, byDay } = weekTotals();
  const work = CATS.filter(c => c.id !== 'pahinga');
  const max = Math.max(1, ...work.map(c => byCat[c.id]));
  const dayMax = Math.max(1, ...days.map(d => work.reduce((s, c) => s + byDay[d][c.id], 0)));
  const bars = work.map(c => `<div class="bar k-${c.id}">
      <div class="lbl"><span>${c.name}</span><span class="v num">${hrs(byCat[c.id])}</span></div>
      <div class="track"><div style="width:${(byCat[c.id] / max * 100).toFixed(1)}%"></div></div></div>`).join('');
  const dayRows = days.map(d => {
    const tot = work.reduce((s, c) => s + byDay[d][c.id], 0);
    const segs = work.map(c => byDay[d][c.id] ? `<i class="${GROUPCLASS[c.group]}" style="width:${(byDay[d][c.id] / dayMax * 100).toFixed(1)}%" title="${c.name}"></i>` : '').join('');
    return `<div class="day"><span><b>${DAYS[keyDate(d).getDay()].slice(0, 3)}</b><small class="num">${shortDate(d)}</small></span><div class="stack">${segs}</div><span class="v num">${Math.round(tot / 60)}</span></div>`;
  }).join('');
  return `${sampleBanner()}
    ${spanSwitch()}
    <section class="sec">
      <h2>Huling ${span} araw</h2>
      <p class="lead num">${shortDate(days[0])} hanggang ${shortDate(days[days.length - 1])}</p>
    </section>
    <div class="pair">
      <div class="big care"><span class="n num">${bigHrs(care(byCat))}</span><span>Bahay at alaga, walang bayad</span></div>
      <div class="big kita"><span class="n num">${bigHrs(kita(byCat))}</span><span>Hanapbuhay (baboy, kape, bukid)</span></div>
    </div>
    <section class="sec"><h2>Saan napunta ang oras mo</h2><div class="bars">${bars}</div>
      <p class="note num">Pahinga: ${hrs(byCat.pahinga)}</p></section>
    ${span === 7 ? `<section class="sec"><h2>Oras kada araw</h2>
      <div class="legend"><span class="g-care">Bahay at alaga</span><span class="g-kita">Hanapbuhay</span><span class="g-samahan">Samahan</span></div>
      <div class="days">${dayRows}</div></section>` : ''}`;
}

function reportText() {
  const { days, byCat } = weekTotals();
  const lines = [
    S.name ? `Oras at Kita, ${S.name}` : 'Oras at Kita',
    `${shortDate(days[0])} hanggang ${shortDate(days[days.length - 1])}`,
    '',
    ...CATS.map(c => `${c.name}: ${hrs(byCat[c.id])}`),
    '',
    `Bahay at alaga, walang bayad: ${hrs(care(byCat))}`,
    `Hanapbuhay: ${hrs(kita(byCat))}`,
  ];
  if (S.sample) lines.push('', '(sample lang, hindi totoo)');
  return lines.join('\n');
}

function viewUlat() {
  return `${sampleBanner()}
    ${spanSwitch()}
    <section class="sec">
      <h2>Report ng huling ${span} araw</h2>
      <p class="lead">Pindutin ang I-send sa GC at piliin ang Messenger o Viber.</p>
    </section>
    <div class="field"><label for="pname">Pangalan mo</label>
      <input id="pname" autocomplete="name" maxlength="40" placeholder="Pwedeng palayaw" value="${esc(S.name || '')}">
      <p class="note">Hindi required. Lalabas ito sa taas ng report.</p></div>
    ${db ? `<div class="code"><div class="lbl"><b>Member number mo</b><br><span class="note">Itanong sa treasurer ng PFAI</span></div>
      <div class="step"><button type="button" id="mminus" aria-label="Bawasan ang member number">−</button><output id="mval" class="num">${S.member}</output><button type="button" id="mplus" aria-label="Dagdagan ang member number">+</button></div></div>` : ''}
    <pre id="report">${esc(reportText())}</pre>
    <button type="button" class="primary" id="sendbtn">I-send sa GC</button>
    <button type="button" class="wide" id="copybtn">I-copy</button>
    <p class="note" id="syncline">${esc(syncText())}</p>
    ${groupHTML()}
    <button type="button" class="wide danger" id="wipe">I-delete lahat</button>`;
}

/* help, reminder, install and share */
let installPrompt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; if (tab === 'tulong') render(); });

function viewTulong() {
  const r = S.remind;
  return `<section class="sec">
      <h2>Paano gamitin</h2>
      <ol class="steps">
        <li><div>Sa Ngayon, pindutin ang ginagawa mo. Magsisimula ang bilang.</div></li>
        <li><div>Pwede mong isara ang app o i-lock ang phone. Tuloy pa rin ang bilang.</div></li>
        <li><div>Pag tapos ka na, buksan ulit at pindutin ang Tapos na.</div></li>
        <li><div>Nakalimutan? Pindutin ang Ilagay ang oras at piliin kung kailan ka nagsimula at natapos.</div></li>
        <li><div>Sa Linggo, makikita mo kung saan napunta ang oras mo. Sa Report, i-send mo sa GC ng samahan.</div></li>
      </ol>
    </section>
    <section class="sec">
      <h2>Saan naka-save ang mga oras ko?</h2>
      <ul class="facts">
        <li>Sa phone mo lang naka-save, parang notebook sa bag mo.</li>
        <li>Iisang app lang ang gamitin. Kapag binuksan mo ito sa ibang app o ibang phone, blangko ito, kasi nasa unang app ang mga oras mo.</li>
        <li>Walang account o password. Wala ring kailangang tandaan.</li>
        <li>Walang makakakita hangga't hindi mo sine-send ang report.</li>
        <li>Kapag nawala, nasira o na-reset ang phone, mawawala rin ito. I-send ang report sa sarili mo kada linggo para may kopya.</li>
        <li>Hindi kailangan ng load para mag-log.</li>
      </ul>
    </section>
    <section class="sec">
      <h2>Reminder tuwing gabi</h2>
      ${NATIVE ? `<p class="lead">Magpapadala ang app ng reminder sa oras na pipiliin mo.</p>
      <div class="field"><label for="rtime">Oras ng reminder</label><input type="time" id="rtime" value="${esc(r.time)}"></div>
      <button type="button" class="primary" id="rset">${r.on ? 'Palitan ang oras' : 'I-on ang reminder'}</button>
      ${r.on ? '<button type="button" class="wide" id="roff">I-off ang reminder</button>' : ''}`
      : '<p class="lead">Mag-set ng alarm sa phone mo, mga 6:00 PM. Pangalanan itong Oras at Kita.</p>'}
    </section>
    <details class="more"><summary>I-share at i-install</summary><div>
    ${NATIVE ? `<section class="sec">
      <h2>Ilagay sa home screen</h2>
      <p class="lead">Ilagay ang mga button sa home screen para isang pindot lang kahit hindi binubuksan ang app.</p>
      <button type="button" class="primary" id="pinw">Ilagay ang widget</button>
    </section>` : `<section class="sec">
      <h2>Ilagay sa home screen</h2>
      <p class="lead">Para isang pindot lang pag bubuksan mo. Sa Chrome, pindutin ang tatlong tuldok at piliin ang Add to Home screen.</p>
      ${installPrompt ? '<button type="button" class="wide" id="pwa">Ilagay sa home screen</button>' : ''}
      <p class="note">Sa iPhone, pindutin ang Share sa Safari tapos Add to Home Screen.</p>
    </section>
    <section class="sec">
      <h2>Para sa Android, hindi galing Play Store</h2>
      <p class="lead">May reminder at notification ang app na ito. Magtatanong muna ang phone bago i-install dahil wala pa ito sa Play Store.</p>
      <a class="wide" href="oras-at-kita.apk" download>I-download ang app</a>
    </section>`}
    <section class="sec">
      <h2>I-share sa kasama</h2>
      <p class="lead">Ipa-scan ang QR code sa camera ng phone nila.</p>
      <img class="qr" src="qr.svg" alt="QR code ng oras-at-kita.stimmie.dev" width="240" height="240">
      <button type="button" class="wide" id="sharelink">I-send ang link</button>
    </section>
    </div></details>`;
}

function bindTulong() {
  const set = document.getElementById('rset');
  if (set) set.onclick = () => {
    const time = document.getElementById('rtime').value;
    if (!time) return toast('Pumili muna ng oras.');
    S.remind = { on: true, time }; save();
    NATIVE.setReminder(time); render(); toast('Naka-on ang reminder.');
  };
  const off = document.getElementById('roff');
  if (off) off.onclick = () => { S.remind.on = false; save(); NATIVE.setReminder(''); render(); toast('Naka-off ang reminder.'); };
  const pin = document.getElementById('pinw');
  if (pin) pin.onclick = () => { if (!NATIVE.pinWidget()) toast('Pindutin nang matagal ang home screen, piliin ang Widgets, tapos Oras at Kita.'); };
  const pwa = document.getElementById('pwa');
  if (pwa) pwa.onclick = () => { installPrompt.prompt(); installPrompt = null; render(); };
  document.getElementById('sharelink').onclick = () => shareText(SITE);
}

async function shareText(text) {
  if (NATIVE) return NATIVE.share(text);
  if (navigator.share) return navigator.share({ text }).catch(() => {});
  try { await navigator.clipboard.writeText(text); toast('Na-copy na.'); } catch (e) { toast('Hindi ma-copy. Pindutin nang matagal ang text.'); }
}

function groupHTML() {
  if (!db) return '';
  if (!S.group) return `<section class="sec">
      <h2>Samahan</h2>
      <p class="lead">Ilagay ang code na ibinigay ng treasurer sa meeting. Kabuuan lang ng samahan ang makikita, hindi ang bawat isa.</p>
      <div class="field"><label for="gcode">Code ng samahan</label>
        <input id="gcode" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="halimbawa, pfai-2026">
        <p class="err" id="gerr" hidden></p></div>
      <button type="button" class="primary" id="join">Join bilang Member #${S.member}</button>
    </section>`;
  return `<section class="sec">
      <h2>${esc(S.group.name)}</h2>
      <p class="lead">Member #${S.member} ka rito. Kabuuan ng lahat ng kasapi sa nakaraang 7 araw.</p>
      <div class="gstats" id="gstats"><p class="note">Kinukuha pa...</p></div>
      <button type="button" class="wide" id="leave">Umalis sa samahan</button>
    </section>`;
}

async function loadGroup() {
  const el = document.getElementById('gstats'); if (!el || !db) return;
  if (!navigator.onLine) { el.innerHTML = '<p class="note">Kailangan ng internet para makita ang kabuuan ng samahan.</p>'; return; }
  try {
    await signIn();
    const d = last7();
    const { data, error } = await db.rpc('group_week', { p_from: d[0], p_to: d[6] });
    if (error) throw error;
    if (!data) { S.group = null; save(); render(); return; }
    const c = data.cats || {}, n = Math.max(1, data.reporting);
    const care = (c.bahay || 0) + (c.alaga || 0), kita = (c.babuyan || 0) + (c.kapehan || 0) + (c.iba || 0);
    el.innerHTML = `<div class="pair">
        <div class="big care"><span class="n num">${hrsShort(care / n)}<small> oras</small></span><span>walang bayad, karaniwan bawat kasapi</span></div>
        <div class="big kita"><span class="n num">${hrsShort(kita / n)}<small> oras</small></span><span>hanapbuhay, karaniwan bawat kasapi</span></div>
      </div>
      <p class="note num">${data.reporting} sa ${data.members} kasapi ang may log ngayong linggo. Lahat-lahat, ${hrsShort(care)} oras ang walang bayad at ${hrsShort(kita)} oras ang hanapbuhay.</p>`;
  } catch (e) {
    el.innerHTML = '<p class="note">Hindi makuha ang kabuuan ngayon. Subukan ulit mamaya.</p>';
  }
}

async function joinGroup() {
  const code = document.getElementById('gcode').value.trim().toLowerCase();
  const err = document.getElementById('gerr');
  const show = m => { err.textContent = m; err.hidden = false; };
  if (!code) return show('Ilagay muna ang code.');
  if (!navigator.onLine) return show('Kailangan ng internet para sumali.');
  const btn = document.getElementById('join'); btn.disabled = true; btn.textContent = 'Sumasali...';
  try {
    await signIn();
    const { data, error } = await db.rpc('join_group', { p_code: code, p_member_no: S.member });
    if (error) {
      if (error.code === 'P0002') return show('Walang samahan na may ganitong code. Pakitingnan ulit.');
      if (error.code === '23505') return show('May gumagamit na ng Member #' + S.member + '. Palitan ang numero sa itaas.');
      throw error;
    }
    S.group = { name: data }; save(); render(); sync(); toast('Kasama ka na sa ' + data + '.');
  } catch (e) {
    show('Hindi nakasali. Subukan ulit.');
  } finally {
    if (btn.isConnected) { btn.disabled = false; btn.textContent = 'Join bilang Member #' + S.member; }
  }
}

function render() {
  document.getElementById('dateline').textContent = (() => { const d = new Date(); return DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate(); })();
  const main = document.getElementById('main');
  const tabs = document.getElementById('tabs');
    tabs.hidden = !S.consent;
  if (!S.consent) { document.body.classList.remove('sampling'); document.getElementById('timer').hidden = true; main.innerHTML = viewIntro(); bindIntro(); return; }
  document.getElementById('demo').hidden = !S.sample;
  document.body.classList.toggle('sampling', !!S.sample);
  renderTimer();
  main.innerHTML = '<div class="view">' + (tab === 'linggo' ? viewLinggo() : tab === 'ulat' ? viewUlat() : tab === 'tulong' ? viewTulong() : viewNgayon()) + '</div>';
  tabs.querySelectorAll('button').forEach(b => b.dataset.tab === tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  bindView();
  clearInterval(tick);
  if (S.running && !document.hidden) tick = setInterval(renderTimer, 15000);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) clearInterval(tick); else if (S.consent && tab === 'ngayon') render(); });

function bindIntro() {
  document.getElementById('go').onclick = () => { S.consent = true; save(); render(); scrollTo(0, 0); };
  document.getElementById('try').onclick = () => { S.consent = true; loadSample(); tab = 'linggo'; render(); scrollTo(0, 0); };
}

function bindView() {
  document.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => start(b.dataset.cat));
  document.querySelectorAll('[data-span]').forEach(b => b.onclick = () => { span = +b.dataset.span; render(); });
  const sy = document.getElementById('sameyest'); if (sy) sy.onclick = copyYesterday;
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const i = S.entries.findIndex(e => e.id === b.dataset.del); if (i < 0) return;
    const [gone] = S.entries.splice(i, 1);
    if (!gone.sample) S.dels.push(gone.id);
    save(); render(); sync();
    toast('Na-delete ang ' + CAT[gone.cat].name + '.', () => {
      S.dels = S.dels.filter(x => x !== gone.id); gone.synced = false; S.entries.push(gone); save(); render(); sync(); });
  });
  const add = document.getElementById('addbtn'); if (add) add.onclick = () => openSheet();
  const ay = document.getElementById('addyest'); if (ay) ay.onclick = () => openSheet({ day: 1 });
  if (tab === 'tulong') bindTulong();
  const mm = document.getElementById('mminus'), mp = document.getElementById('mplus');
  if (mm) {
    const set = v => {
      if (S.group) return toast('Umalis muna sa samahan bago palitan ang numero.');
      S.member = Math.min(99, Math.max(1, v)); save();
      document.getElementById('mval').textContent = S.member;
      document.getElementById('report').textContent = reportText();
      const j = document.getElementById('join'); if (j) j.textContent = 'Join bilang Member #' + S.member;
    };
    mm.onclick = () => set(S.member - 1); mp.onclick = () => set(S.member + 1);
  }
  const pn = document.getElementById('pname');
  if (pn) {
    pn.oninput = () => { S.name = pn.value.trim(); save(); document.getElementById('report').textContent = reportText(); };
    document.getElementById('copybtn').onclick = async () => {
      try { await navigator.clipboard.writeText(reportText()); toast('Na-copy na ang report.'); }
      catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById('report')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Naka-highlight ang report. Pindutin nang matagal para i-copy.'); }
    };
    document.getElementById('sendbtn').onclick = () => shareText(reportText());
    const jb = document.getElementById('join'); if (jb) jb.onclick = joinGroup;
    const lv = document.getElementById('leave');
    if (lv) lv.onclick = async () => {
      if (!navigator.onLine) return toast('Kailangan ng internet para umalis.');
      try { await signIn(); const { error } = await db.from('members').delete().not('user_id', 'is', null); if (error) throw error; S.group = null; save(); render(); toast('Umalis ka na sa samahan.'); }
      catch (e) { toast('Hindi nakaalis. Subukan ulit.'); }
    };
    loadGroup();
    const w = document.getElementById('wipe');
    w.onclick = () => {
      if (w.dataset.armed) { S.entries = []; S.running = null; S.sample = false; S.dels = []; S.wipe = true; save(); tab = 'ngayon'; render(); sync(); toast('Na-delete na lahat.'); return; }
      w.dataset.armed = '1'; w.textContent = 'Pindutin ulit para i-delete lahat';
      setTimeout(() => { if (w.isConnected) { delete w.dataset.armed; w.textContent = 'I-delete lahat'; } }, 4000);
    };
  }
}

/* add forgotten time, or fix a timer that ran too long */
const hhmm = t => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const atTime = (dayStart, v) => { const [h, m] = v.split(':').map(Number); const d = new Date(dayStart); d.setHours(h, m, 0, 0); return d.getTime(); };
function openSheet(o = {}) {
  const edit = o.edit;
  let cat = edit ? edit.cat : S.running ? S.running.cat : 'bahay', day = o.day || 0;
  const now = Date.now() - Date.now() % 300000;
  let from = hhmm(now - 3600000), to = hhmm(now);
  document.querySelectorAll('.scrim, .sheet, .toast').forEach(x => x.remove());
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-label', edit ? 'Tapos ka na ba?' : 'Ilagay ang oras');
  const draw = () => {
    sh.innerHTML = edit ? `<div class="wrap">
      <h2>Tapos ka na ba?</h2>
      <p class="lead">Baka nakalimutan mong pindutin ang Tapos na. Nagsimula ka ng ${new Date(edit.start).toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit' })}. Anong oras ka natapos sa ${CAT[cat].name}?</p>
      <div class="field"><label for="tend">Natapos ako ng</label><input type="time" id="tend" value="${hhmm(edit.start + Math.min(edit.mins, 120) * 60000)}"></div>
      <div class="row2"><button type="button" class="wide" id="cancel">Okay na yan</button><button type="button" class="primary" id="saveadd">I-save</button></div>
    </div>` : `<div class="wrap">
      <h2>Ilagay ang oras</h2>
      <div class="chips">${CATS.map(c => `<button type="button" class="chip k-${c.id}" aria-pressed="${c.id === cat}" data-c="${c.id}" id="chip-${c.id}">${icon(c.id)}${c.name}</button>`).join('')}</div>
      <div class="chips"><button type="button" class="chip plain" aria-pressed="${day === 0}" data-d="0" id="d0">Ngayon</button><button type="button" class="chip plain" aria-pressed="${day === 1}" data-d="1" id="d1">Kahapon</button></div>
      <div class="times">
        <div class="field"><label for="tfrom">Mula</label><input type="time" id="tfrom" value="${from}"></div>
        <div class="field"><label for="tto">Hanggang</label><input type="time" id="tto" value="${to}"></div>
      </div>
      <div class="row2"><button type="button" class="wide" id="cancel">Huwag na</button><button type="button" class="primary" id="saveadd">I-save</button></div>
    </div>`;
    sh.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { keep(); cat = b.dataset.c; draw(); });
    sh.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { keep(); day = +b.dataset.d; draw(); });
    sh.querySelector('#cancel').onclick = close;
    sh.querySelector('#saveadd').onclick = () => {
      if (edit) {
        const v = sh.querySelector('#tend').value; if (!v) return toast('Pumili muna ng oras.');
        let end = atTime(edit.start, v); if (end <= edit.start) end += 864e5;
        edit.mins = Math.max(1, Math.min(960, Math.round((end - edit.start) / 60000))); edit.synced = false;
        save(); close(); render(); sync(); toast('Na-save ang ' + CAT[cat].name + ' (' + hrs(edit.mins) + ')'); return;
      }
      keep();
      if (!from || !to) return toast('Pumili ng Mula at Hanggang.');
      const t = new Date(), base = new Date(t.getFullYear(), t.getMonth(), t.getDate() - day).getTime();
      const s = atTime(base, from), e = atTime(base, to);
      if (e <= s) return toast('Dapat mas huli ang Hanggang kaysa Mula.');
      dropSample();
      const mins = Math.round((e - s) / 60000);
      S.entries.push({ id: uid(), cat, day: dayKey(base), mins, start: s });
      save(); close(); render(); sync(); toast('Na-save ang ' + CAT[cat].name + ' (' + hrs(mins) + ')');
    };
  };
  const keep = () => { const f = sh.querySelector('#tfrom'), t = sh.querySelector('#tto'); if (f) from = f.value; if (t) to = t.value; };
  const close = () => { scrim.remove(); sh.remove(); };
  scrim.onclick = close;
  draw();
  document.body.append(scrim, sh);
  sh.querySelector(edit ? '#tend' : '#chip-' + cat).focus();
}

/* sample week for the class demo */
function loadSample() {
  const plan = { bahay: [210, 240, 195, 225, 250, 200, 230], alaga: [180, 150, 200, 165, 190, 175, 160], babuyan: [100, 95, 110, 90, 105, 100, 95],
    kapehan: [0, 150, 180, 0, 210, 165, 0], iba: [60, 0, 45, 90, 0, 30, 75], samahan: [0, 0, 0, 120, 0, 0, 60], pahinga: [420, 400, 410, 430, 390, 420, 450] };
  last7().forEach((d, i) => {
    const base = keyDate(d); base.setHours(5, 0, 0, 0);
    let t = base.getTime();
    for (const c of ['bahay', 'babuyan', 'alaga', 'kapehan', 'iba', 'samahan']) {
      const m = plan[c][i]; if (!m) continue;
      S.entries.push({ id: uid(), cat: c, day: d, mins: m, start: t, sample: true }); t += m * 60000;
    }
    S.entries.push({ id: uid(), cat: 'pahinga', day: d, mins: plan.pahinga[i], start: null, sample: true });
  });
  S.sample = true; save();
}

let toastTimer;
function toast(msg, undo) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>` + (undo ? '<button type="button">Undo</button>' : '');
  if (undo) t.querySelector('button').onclick = () => { t.remove(); undo(); };
  document.body.append(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), undo ? 6000 : 3000);
}

document.getElementById('startreal').onclick = () => {
  S.entries = S.entries.filter(e => !e.sample); S.sample = false; save();
  tab = 'ngayon'; render(); scrollTo(0, 0);
  toast('Handa na. Pindutin ang ginagawa mo.');
};
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab; render(); scrollTo(0, 0);
});
addEventListener('online', () => { sync(); drawSyncLine(); });
addEventListener('offline', drawSyncLine);
if (!NATIVE && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
pullNative();
render();
sync().then(pullIfEmpty);
</script>
